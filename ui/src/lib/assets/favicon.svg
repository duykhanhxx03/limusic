<!-- The app mark, same geometry as the bundled window/tray icon (src-tauri/icons) and the same
     ring-and-triangle shape as Logo.svelte. Filled rather than stroked-on-transparent: this one is
     drawn at 16px in a browser tab and as the fallback for a custom app icon, where a hairline
     ring disappears and the red plate is what carries recognition. -->
